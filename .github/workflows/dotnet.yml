# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backend/tests/InvoicePro.UnitTests/InvoicePro.UnitTests.csproj
      - run: dotnet test backend/tests/InvoicePro.UnitTests/InvoicePro.UnitTests.csproj --no-restore --verbosity normal
      - run: dotnet build backend/src/InvoicePro.Api/InvoicePro.Api.csproj
